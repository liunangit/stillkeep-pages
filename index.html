<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stillkeep</title>
  <meta name="description" content="Privacy policy and support pages for Stillkeep.">
  <link rel="icon" href="assets/stillkeep-icon.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Stillkeep home">
      <img src="assets/stillkeep-icon.png" alt="" class="brand-icon">
      <span data-i18n="brandName">Stillkeep</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="privacy.html" data-i18n="navPrivacy">Privacy</a>
      <a href="support.html" data-i18n="navSupport">Support</a>
    </nav>
    <div class="language-switcher" aria-label="Language">
      <button type="button" data-lang="zh-Hans">中文</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" data-i18n="homeEyebrow">App information</p>
        <h1 data-i18n="homeTitle">Stillkeep</h1>
        <p class="lead" data-i18n="homeLead">A calm personal inventory app for tracking what you own and what you are thinking about buying.</p>
        <div class="actions">
          <a class="button primary" href="privacy.html" data-i18n="homePrivacyAction">View Privacy Policy</a>
          <a class="button secondary" href="support.html" data-i18n="homeSupportAction">Get Support</a>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <img src="assets/stillkeep-icon.png" alt="">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span data-i18n="footer">© 2026 Stillkeep. All rights reserved.</span>
  </footer>

  <script src="assets/i18n.js"></script>

</html>
